[project]
name = "blog-agen"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sivasai", email = "mokara.sivasai28@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "langchain>=1.4.7",
    "langchain-cli[inmem]>=0.0.37",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.0",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.17",
    "uvicorn>=0.54.0",
    "watchdog>=6.0.0",
]

[project.scripts]
blog-agen = "blog_agen:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
